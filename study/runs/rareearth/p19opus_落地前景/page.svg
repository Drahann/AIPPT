<text class="ct" x="224" y="63" text-anchor="start" font-family="'Alibaba PuHuiTi H','Source Han Sans CN Heavy','Microsoft YaHei',sans-serif" font-size="46.0" fill="url(#g1)"><tspan x="224" dy="0.0">落地前景 · 产业化实施路径</tspan></text>
<text class="ct" x="226" y="98" text-anchor="start" font-family="'OPPOSans M','Source Han Sans CN Medium','Microsoft YaHei',sans-serif" font-size="20.0" fill="#BFE0F2"><tspan x="226" dy="0.0">TIE331 萜类化合物辅助稀土金属回收  ·  三阶段产业化推进路径</tspan></text>
<text class="ct" x="300" y="141" text-anchor="start" font-family="'OPPOSans R','Source Han Sans CN Regular','Microsoft YaHei',sans-serif" font-size="20.0" fill="#BFE0F2"><tspan x="300" dy="0.0">项目当前已完成实验室系统验证，技术方案在高酸度、含氟硫等复杂工业废液环境中展现出优</tspan><tspan x="300" dy="26.4">异的铈离子选择性萃取能力、两相分离清晰度及溶剂循环稳定性，具备中试放大条件，并据产</tspan><tspan x="300" dy="26.4">业验证阶段定位制定三阶段推进路径。</tspan></text>
<text class="ct" x="122" y="322" text-anchor="start" font-family="'Alibaba PuHuiTi H','OPPOSans B','Source Han Sans CN Heavy','Arial',sans-serif" font-size="50.0" fill="url(#g2)"><tspan x="122" dy="0.0">01</tspan></text>
<text class="ct" x="222" y="301" text-anchor="start" font-family="'OPPOSans M','Source Han Sans CN Medium','Microsoft YaHei',sans-serif" font-size="19.0" fill="#86B6D8"><tspan x="222" dy="0.0">推进阶段</tspan></text>
<text class="ct" x="222" y="333" text-anchor="start" font-family="'Alibaba PuHuiTi H','Source Han Sans CN Heavy','Microsoft YaHei',sans-serif" font-size="24.0" fill="url(#g3)"><tspan x="222" dy="0.0">第一年</tspan></text>
<text class="ct" x="256" y="370" text-anchor="middle" font-family="'Alibaba PuHuiTi H','Source Han Sans CN Heavy','Microsoft YaHei',sans-serif" font-size="22.0" fill="#FFFFFF"><tspan x="256" dy="0.0">中试验证 · 标杆突破</tspan></text>
<text class="ct" x="109" y="489" text-anchor="start" font-family="'OPPOSans R','Source Han Sans CN Regular','Microsoft YaHei',sans-serif" font-size="19.0" fill="#BFE0F2"><tspan x="109" dy="0.0">完成TIE331工艺参数固化与</tspan><tspan x="109" dy="25.1">中试放大，对接2家稀土回收领域</tspan><tspan x="109" dy="25.1">标杆企业开展小批量试用，验证单</tspan><tspan x="109" dy="25.1">级萃取效率（目标回收率≥85%</tspan><tspan x="109" dy="25.1">）与工艺适配性，形成可复制的技</tspan><tspan x="109" dy="25.1">术实施方案。</tspan></text>
<text class="ct" x="524" y="292" text-anchor="start" font-family="'Alibaba PuHuiTi H','OPPOSans B','Source Han Sans CN Heavy','Arial',sans-serif" font-size="50.0" fill="url(#g4)"><tspan x="524" dy="0.0">02</tspan></text>
<text class="ct" x="624" y="271" text-anchor="start" font-family="'OPPOSans M','Source Han Sans CN Medium','Microsoft YaHei',sans-serif" font-size="19.0" fill="#86B6D8"><tspan x="624" dy="0.0">推进阶段</tspan></text>
<text class="ct" x="624" y="303" text-anchor="start" font-family="'Alibaba PuHuiTi H','Source Han Sans CN Heavy','Microsoft YaHei',sans-serif" font-size="24.0" fill="url(#g5)"><tspan x="624" dy="0.0">第二年</tspan></text>
<text class="ct" x="658" y="340" text-anchor="middle" font-family="'Alibaba PuHuiTi H','Source Han Sans CN Heavy','Microsoft YaHei',sans-serif" font-size="22.0" fill="#FFFFFF"><tspan x="658" dy="0.0">产品拓展 · 网络构建</tspan></text>
<text class="ct" x="511" y="471" text-anchor="start" font-family="'OPPOSans R','Source Han Sans CN Regular','Microsoft YaHei',sans-serif" font-size="19.0" fill="#BFE0F2"><tspan x="511" dy="0.0">推进TIE332-TIE350</tspan><tspan x="511" dy="25.1">系列开发，拓展至3家标杆客户，</tspan><tspan x="511" dy="25.1">深化校企协同合作，积累跨场景应</tspan><tspan x="511" dy="25.1">用数据，完善“技术方案+定制服</tspan><tspan x="511" dy="25.1">务”轻资产服务模式。</tspan></text>
<text class="ct" x="926" y="262" text-anchor="start" font-family="'Alibaba PuHuiTi H','OPPOSans B','Source Han Sans CN Heavy','Arial',sans-serif" font-size="50.0" fill="url(#g6)"><tspan x="926" dy="0.0">03</tspan></text>
