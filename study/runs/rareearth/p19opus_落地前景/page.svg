<text class="ct" x="1026" y="273" text-anchor="start" font-family="'Alibaba PuHuiTi H','Source Han Sans CN Heavy','Microsoft YaHei',sans-serif" font-size="24.0" fill="url(#g7)"><tspan x="1026" dy="0.0">第三年</tspan></text>
<text class="ct" x="1060" y="310" text-anchor="middle" font-family="'Alibaba PuHuiTi H','Source Han Sans CN Heavy','Microsoft YaHei',sans-serif" font-size="22.0" fill="#FFFFFF"><tspan x="1060" dy="0.0">模式固化 · 规模预备</tspan></text>
<text class="ct" x="913" y="429" text-anchor="start" font-family="'OPPOSans R','Source Han Sans CN Regular','Microsoft YaHei',sans-serif" font-size="19.0" fill="#BFE0F2"><tspan x="913" dy="0.0">完成TIE331-TIE381</tspan><tspan x="913" dy="25.1">全系产品矩阵优化，依托客户反馈</tspan><tspan x="913" dy="25.1">闭环迭代技术，实现累计销售收入</tspan><tspan x="913" dy="25.1">20万元目标，验证商业模式可行</tspan><tspan x="913" dy="25.1">性，为规模化复制奠定实证基础与</tspan><tspan x="913" dy="25.1">客户资源储备。</tspan></text>
