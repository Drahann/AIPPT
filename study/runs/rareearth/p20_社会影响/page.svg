<text class="ct" x="640" y="133" text-anchor="middle" font-family="'OPPOSans M','Source Han Sans CN Medium','Microsoft YaHei',sans-serif" font-size="24.0" fill="#CFE6FF"><tspan x="640" dy="0.0">SOCIAL  IMPACT · 三维社会价值</tspan></text>
<text class="ct" x="241" y="254" text-anchor="middle" font-family="'Alibaba PuHuiTi H','Source Han Sans CN Heavy','Microsoft YaHei',sans-serif" font-size="34.0" fill="url(#g2)"><tspan x="241" dy="0.0">一</tspan></text>
<text class="ct" x="150" y="322" text-anchor="start" font-family="'Alibaba PuHuiTi H','Source Han Sans CN Heavy','Microsoft YaHei',sans-serif" font-size="30.0" fill="url(#g3)"><tspan x="150" dy="0.0">民生福祉</tspan></text>
<text class="ct" x="152" y="342" text-anchor="start" font-family="'OPPOSans M','Source Han Sans CN Medium','Microsoft YaHei',sans-serif" font-size="18.0" fill="#5EB0FC"><tspan x="152" dy="0.0">LIVELIHOOD</tspan></text>
<text class="ct" x="106" y="356" text-anchor="start" font-family="'OPPOSans B','Source Han Sans CN Bold','Microsoft YaHei',sans-serif" font-size="18.0" fill="#F2D290"><tspan x="106" dy="0.0">就业拉动 · 人才提质 · 获得</tspan><tspan x="106" dy="23.8">感增强</tspan></text>
<text class="ct" x="80" y="407" text-anchor="start" font-family="'Alibaba PuHuiTi H','Source Han Sans CN Heavy','Microsoft YaHei',sans-serif" font-size="18.0" fill="#0BF9FE"><tspan x="80" dy="0.0">▸</tspan></text>
<text class="ct" x="98" y="419" text-anchor="start" font-family="'OPPOSans R','Source Han Sans CN Regular','Microsoft YaHei',sans-serif" font-size="18.0" fill="#CFE6FF"><tspan x="98" dy="0.0">直接或间接带动相关行业新增就业约5</tspan><tspan x="98" dy="23.8">0人，就业拉动效应显著</tspan></text>
<text class="ct" x="80" y="475" text-anchor="start" font-family="'Alibaba PuHuiTi H','Source Han Sans CN Heavy','Microsoft YaHei',sans-serif" font-size="18.0" fill="#0BF9FE"><tspan x="80" dy="0.0">▸</tspan></text>
<text class="ct" x="98" y="475" text-anchor="start" font-family="'OPPOSans R','Source Han Sans CN Regular','Microsoft YaHei',sans-serif" font-size="18.0" fill="#CFE6FF"><tspan x="98" dy="0.0">以萃取剂技术创新弥补工业废弃物资源</tspan><tspan x="98" dy="23.8">化人才结构性缺口，系统提升技术能力</tspan><tspan x="98" dy="23.8">与职业素养</tspan></text>
<text class="ct" x="80" y="543" text-anchor="start" font-family="'Alibaba PuHuiTi H','Source Han Sans CN Heavy','Microsoft YaHei',sans-serif" font-size="18.0" fill="#0BF9FE"><tspan x="80" dy="0.0">▸</tspan></text>
<text class="ct" x="98" y="543" text-anchor="start" font-family="'OPPOSans R','Source Han Sans CN Regular','Microsoft YaHei',sans-serif" font-size="18.0" fill="#CFE6FF"><tspan x="98" dy="0.0">依托萜类化合物产业链协同，提供技术</tspan><tspan x="98" dy="23.8">含量高、成长清晰的岗位，增强职业稳</tspan><tspan x="98" dy="23.8">定性与社会认同</tspan></text>
<text class="ct" x="80" y="611" text-anchor="start" font-family="'Alibaba PuHuiTi H','Source Han Sans CN Heavy','Microsoft YaHei',sans-serif" font-size="18.0" fill="#0BF9FE"><tspan x="80" dy="0.0">▸</tspan></text>
<text class="ct" x="98" y="611" text-anchor="start" font-family="'OPPOSans R','Source Han Sans CN Regular','Microsoft YaHei',sans-serif" font-size="18.0" fill="#CFE6FF"><tspan x="98" dy="0.0">产业链价值提升间接优化薪酬结构与社</tspan><tspan x="98" dy="23.8">保覆盖，增强劳动者获得感与就业可持</tspan><tspan x="98" dy="23.8">续性</tspan></text>
<text class="ct" x="640" y="254" text-anchor="middle" font-family="'Alibaba PuHuiTi H','Source Han Sans CN Heavy','Microsoft YaHei',sans-serif" font-size="34.0" fill="url(#g4)"><tspan x="640" dy="0.0">二</tspan></text>
<text class="ct" x="549" y="322" text-anchor="start" font-family="'Alibaba PuHuiTi H','Source Han Sans CN Heavy','Microsoft YaHei',sans-serif" font-size="30.0" fill="url(#g5)"><tspan x="549" dy="0.0">社会文明</tspan></text>
<text class="ct" x="551" y="342" text-anchor="start" font-family="'OPPOSans M','Source Han Sans CN Medium','Microsoft YaHei',sans-serif" font-size="18.0" fill="#5EB0FC"><tspan x="551" dy="0.0">CIVILIZATION</tspan></text>
<text class="ct" x="505" y="356" text-anchor="start" font-family="'OPPOSans B','Source Han Sans CN Bold','Microsoft YaHei',sans-serif" font-size="18.0" fill="#F2D290"><tspan x="505" dy="0.0">平台协作 · 知识共享 · 包容</tspan><tspan x="505" dy="23.8">韧性</tspan></text>
<text class="ct" x="479" y="407" text-anchor="start" font-family="'Alibaba PuHuiTi H','Source Han Sans CN Heavy','Microsoft YaHei',sans-serif" font-size="18.0" fill="#0BF9FE"><tspan x="479" dy="0.0">▸</tspan></text>
<text class="ct" x="497" y="407" text-anchor="start" font-family="'OPPOSans R','Source Han Sans CN Regular','Microsoft YaHei',sans-serif" font-size="18.0" fill="#CFE6FF"><tspan x="497" dy="0.0">构建&quot;校—企—产&quot;多元协作平台，联</tspan><tspan x="497" dy="23.8">动新西伯利亚国立大学等开展技术研讨</tspan><tspan x="497" dy="23.8">与案例分享</tspan></text>
<text class="ct" x="479" y="475" text-anchor="start" font-family="'Alibaba PuHuiTi H','Source Han Sans CN Heavy','Microsoft YaHei',sans-serif" font-size="18.0" fill="#0BF9FE"><tspan x="479" dy="0.0">▸</tspan></text>
<text class="ct" x="497" y="487" text-anchor="start" font-family="'OPPOSans R','Source Han Sans CN Regular','Microsoft YaHei',sans-serif" font-size="18.0" fill="#CFE6FF"><tspan x="497" dy="0.0">促进科研人员、企业技术骨干、产业工</tspan><tspan x="497" dy="23.8">人等不同群体深度交流与知识共享</tspan></text>
<text class="ct" x="479" y="543" text-anchor="start" font-family="'Alibaba PuHuiTi H','Source Han Sans CN Heavy','Microsoft YaHei',sans-serif" font-size="18.0" fill="#0BF9FE"><tspan x="479" dy="0.0">▸</tspan></text>
<text class="ct" x="497" y="555" text-anchor="start" font-family="'OPPOSans R','Source Han Sans CN Regular','Microsoft YaHei',sans-serif" font-size="18.0" fill="#CFE6FF"><tspan x="497" dy="0.0">打破行业壁垒与信息孤岛，推动社会资</tspan><tspan x="497" dy="23.8">源优化配置与群体间理解互信</tspan></text>
<text class="ct" x="479" y="611" text-anchor="start" font-family="'Alibaba PuHuiTi H','Source Han Sans CN Heavy','Microsoft YaHei',sans-serif" font-size="18.0" fill="#0BF9FE"><tspan x="479" dy="0.0">▸</tspan></text>
<text class="ct" x="497" y="623" text-anchor="start" font-family="'OPPOSans R','Source Han Sans CN Regular','Microsoft YaHei',sans-serif" font-size="18.0" fill="#CFE6FF"><tspan x="497" dy="0.0">培育开放协作、创新驱动的社会文化，</tspan><tspan x="497" dy="23.8">助力社会向包容、协同、韧性方向演进</tspan></text>
<text class="ct" x="1039" y="254" text-anchor="middle" font-family="'Alibaba PuHuiTi H','Source Han Sans CN Heavy','Microsoft YaHei',sans-serif" font-size="34.0" fill="url(#g6)"><tspan x="1039" dy="0.0">三</tspan></text>
<text class="ct" x="948" y="322" text-anchor="start" font-family="'Alibaba PuHuiTi H','Source Han Sans CN Heavy','Microsoft YaHei',sans-serif" font-size="30.0" fill="url(#g7)"><tspan x="948" dy="0.0">生态文明</tspan></text>
<text class="ct" x="950" y="342" text-anchor="start" font-family="'OPPOSans M','Source Han Sans CN Medium','Microsoft YaHei',sans-serif" font-size="18.0" fill="#5EB0FC"><tspan x="950" dy="0.0">ECOLOGY</tspan></text>
<text class="ct" x="904" y="368" text-anchor="start" font-family="'OPPOSans B','Source Han Sans CN Bold','Microsoft YaHei',sans-serif" font-size="18.0" fill="#F2D290"><tspan x="904" dy="0.0">生产—生活—自然 · 和谐共生</tspan></text>
<text class="ct" x="878" y="407" text-anchor="start" font-family="'Alibaba PuHuiTi H','Source Han Sans CN Heavy','Microsoft YaHei',sans-serif" font-size="18.0" fill="#0BF9FE"><tspan x="878" dy="0.0">▸</tspan></text>
<text class="ct" x="896" y="407" text-anchor="start" font-family="'OPPOSans R','Source Han Sans CN Regular','Microsoft YaHei',sans-serif" font-size="18.0" fill="#CFE6FF"><tspan x="896" dy="0.0">生产端：高选择性萃取实现废液稀土绿</tspan><tspan x="896" dy="23.8">色回收，降排放降消耗，引领清洁化循</tspan><tspan x="896" dy="23.8">环化升级</tspan></text>
<text class="ct" x="878" y="475" text-anchor="start" font-family="'Alibaba PuHuiTi H','Source Han Sans CN Heavy','Microsoft YaHei',sans-serif" font-size="18.0" fill="#0BF9FE"><tspan x="878" dy="0.0">▸</tspan></text>
<text class="ct" x="896" y="487" text-anchor="start" font-family="'OPPOSans R','Source Han Sans CN Regular','Microsoft YaHei',sans-serif" font-size="18.0" fill="#CFE6FF"><tspan x="896" dy="0.0">生活端：示范应用强化资源节约与环保</tspan><tspan x="896" dy="23.8">认知，引导绿色消费与低碳生活方式</tspan></text>
<text class="ct" x="878" y="543" text-anchor="start" font-family="'Alibaba PuHuiTi H','Source Han Sans CN Heavy','Microsoft YaHei',sans-serif" font-size="18.0" fill="#0BF9FE"><tspan x="878" dy="0.0">▸</tspan></text>
<text class="ct" x="896" y="555" text-anchor="start" font-family="'OPPOSans R','Source Han Sans CN Regular','Microsoft YaHei',sans-serif" font-size="18.0" fill="#CFE6FF"><tspan x="896" dy="0.0">自然端：减少废弃物对土壤、水体危害</tspan><tspan x="896" dy="23.8">，助力区域生态修复与生物多样性保护</tspan></text>
<text class="ct" x="878" y="611" text-anchor="start" font-family="'Alibaba PuHuiTi H','Source Han Sans CN Heavy','Microsoft YaHei',sans-serif" font-size="18.0" fill="#0BF9FE"><tspan x="878" dy="0.0">▸</tspan></text>
<text class="ct" x="896" y="623" text-anchor="start" font-family="'OPPOSans R','Source Han Sans CN Regular','Microsoft YaHei',sans-serif" font-size="18.0" fill="#CFE6FF"><tspan x="896" dy="0.0">三端联动构建资源高效、环境友好的可</tspan><tspan x="896" dy="23.8">持续闭环，提供可复制的产业实践路径</tspan></text>
