<text class="ct" x="224" y="63" text-anchor="start" font-family="'Alibaba PuHuiTi H','Source Han Sans CN Heavy','Microsoft YaHei',sans-serif" font-size="46.0" fill="url(#g1)"><tspan x="224" dy="0.0">落地前景 · 综合效益 · 风险应对</tspan></text>
<text class="ct" x="226" y="98" text-anchor="start" font-family="'OPPOSans M','Source Han Sans CN Medium','Microsoft YaHei',sans-serif" font-size="20.0" fill="#BFE0F2"><tspan x="226" dy="0.0">综合效益展望（经济 · 社会）  /  风险应对机制（市场 · 技术 · 运营）</tspan></text>
<text class="ct" x="84" y="154" text-anchor="start" font-family="'Alibaba PuHuiTi H','Source Han Sans CN Heavy','Microsoft YaHei',sans-serif" font-size="22.0" fill="url(#g2)"><tspan x="84" dy="0.0">三 · 综合效益展望</tspan></text>
<text class="ct" x="396" y="154" text-anchor="middle" font-family="'Alibaba PuHuiTi H','Source Han Sans CN Heavy','Microsoft YaHei',sans-serif" font-size="22.0" fill="url(#g3)"><tspan x="396" dy="0.0">双效益</tspan></text>
<text class="ct" x="94" y="261" text-anchor="start" font-family="'Alibaba PuHuiTi H','Source Han Sans CN Heavy','Microsoft YaHei',sans-serif" font-size="23.0" fill="url(#g4)"><tspan x="94" dy="0.0">经济效益</tspan></text>
<text class="ct" x="94" y="323" text-anchor="start" font-family="'OPPOSans R','Source Han Sans CN Regular','Microsoft YaHei',sans-serif" font-size="19.0" fill="#BFE0F2"><tspan x="94" dy="0.0">轻资产运营模式显著降低初期投入，依托溶剂可循环特性压</tspan><tspan x="94" dy="25.1">缩客户侧与项目侧长期成本；三年内验证商业模式可行性，</tspan><tspan x="94" dy="25.1">后续通过技术授权、定制服务等高附加值路径提升盈利空间</tspan><tspan x="94" dy="25.1">，形成“销售-反馈-优化”良性现金流循环。</tspan></text>
<text class="ct" x="686" y="261" text-anchor="start" font-family="'Alibaba PuHuiTi H','Source Han Sans CN Heavy','Microsoft YaHei',sans-serif" font-size="23.0" fill="url(#g5)"><tspan x="686" dy="0.0">社会效益</tspan></text>
<text class="ct" x="686" y="323" text-anchor="start" font-family="'OPPOSans R','Source Han Sans CN Regular','Microsoft YaHei',sans-serif" font-size="19.0" fill="#BFE0F2"><tspan x="686" dy="0.0">推动工业废弃物中稀土资源高效绿色回收，减少环境污染，</tspan><tspan x="686" dy="25.1">惠及稀土产业及受污染地区人群；为行业提供可推广的资源</tspan><tspan x="686" dy="25.1">化技术方案，助力工艺升级与国家循环经济战略实施，彰显</tspan><tspan x="686" dy="25.1">科技赋能可持续发展的社会价值。</tspan></text>
<text class="ct" x="84" y="478" text-anchor="start" font-family="'Alibaba PuHuiTi H','Source Han Sans CN Heavy','Microsoft YaHei',sans-serif" font-size="22.0" fill="url(#g6)"><tspan x="84" dy="0.0">四 · 风险应对机制</tspan></text>
<text class="ct" x="78" y="611" text-anchor="start" font-family="'OPPOSans R','Source Han Sans CN Regular','Microsoft YaHei',sans-serif" font-size="18.0" fill="#BFE0F2"><tspan x="78" dy="0.0">市场风险：采用“精准锚定+梯度扩张”策略</tspan><tspan x="78" dy="23.8">，优先验证高匹配度客户，预留运营资金应对</tspan><tspan x="78" dy="23.8">需求波动，动态优化推广节奏。</tspan></text>
<text class="ct" x="463" y="611" text-anchor="start" font-family="'OPPOSans R','Source Han Sans CN Regular','Microsoft YaHei',sans-serif" font-size="18.0" fill="#BFE0F2"><tspan x="463" dy="0.0">技术风险：依托高校科研平台与中试验证闭环</tspan><tspan x="463" dy="23.8">持续优化工艺参数，建立客户反馈实时迭代机</tspan><tspan x="463" dy="23.8">制，确保技术与产业需求同步演进。</tspan></text>
<text class="ct" x="848" y="587" text-anchor="start" font-family="'OPPOSans R','Source Han Sans CN Regular','Microsoft YaHei',sans-serif" font-size="18.0" fill="#BFE0F2"><tspan x="848" dy="0.0">运营风险：核心团队持股激励（融资后合计3</tspan><tspan x="848" dy="23.8">4.3%）强化长期绑定；专项资金账户与分</tspan><tspan x="848" dy="23.8">阶段拨付制度保障资金高效使用；轻资产结构</tspan><tspan x="848" dy="23.8">降低固定成本负担，全面提升项目抗风险韧性</tspan><tspan x="848" dy="23.8">与可持续发展能力。</tspan></text>
</svg>