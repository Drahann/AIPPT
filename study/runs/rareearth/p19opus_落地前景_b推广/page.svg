<text class="ct" x="224" y="63" text-anchor="start" font-family="'Alibaba PuHuiTi H','Source Han Sans CN Heavy','Microsoft YaHei',sans-serif" font-size="46.0" fill="url(#g1)"><tspan x="224" dy="0.0">落地前景 · 市场推广策略</tspan></text>
<text class="ct" x="226" y="98" text-anchor="start" font-family="'OPPOSans M','Source Han Sans CN Medium','Microsoft YaHei',sans-serif" font-size="20.0" fill="#BFE0F2"><tspan x="226" dy="0.0">构建“点验证—线链接—面扩散”闭环推广体系  ·  三大推进路径</tspan></text>
<text class="ct" x="90" y="155" text-anchor="start" font-family="'Alibaba PuHuiTi H','Source Han Sans CN Heavy','Microsoft YaHei',sans-serif" font-size="24.0" fill="url(#g2)"><tspan x="90" dy="0.0">二 · 市场推广策略</tspan></text>
<text class="ct" x="124" y="301" text-anchor="start" font-family="'Alibaba PuHuiTi H','OPPOSans B','Source Han Sans CN Heavy','Arial',sans-serif" font-size="42.0" fill="url(#g3)"><tspan x="124" dy="0.0">01</tspan></text>
<text class="ct" x="206" y="296" text-anchor="start" font-family="'Alibaba PuHuiTi H','Source Han Sans CN Heavy','Microsoft YaHei',sans-serif" font-size="20.0" fill="url(#g4)"><tspan x="206" dy="0.0">精准锚定标杆合作</tspan></text>
<text class="ct" x="114" y="405" text-anchor="start" font-family="'OPPOSans R','Source Han Sans CN Regular','Microsoft YaHei',sans-serif" font-size="19.0" fill="#BFE0F2"><tspan x="114" dy="0.0">精准锚定标杆合作：聚焦稀土回</tspan><tspan x="114" dy="25.1">收企业及萃取剂生产商，针对单</tspan><tspan x="114" dy="25.1">级萃取效率低、溶剂损耗高等痛</tspan><tspan x="114" dy="25.1">点，以小批量试用快速验证TI</tspan><tspan x="114" dy="25.1">E331产品在回收率提升与成</tspan><tspan x="114" dy="25.1">本控制方面的实效，形成可量化</tspan><tspan x="114" dy="25.1">合作案例。</tspan></text>
<text class="ct" x="526" y="301" text-anchor="start" font-family="'Alibaba PuHuiTi H','OPPOSans B','Source Han Sans CN Heavy','Arial',sans-serif" font-size="42.0" fill="url(#g5)"><tspan x="526" dy="0.0">02</tspan></text>
<text class="ct" x="608" y="296" text-anchor="start" font-family="'Alibaba PuHuiTi H','Source Han Sans CN Heavy','Microsoft YaHei',sans-serif" font-size="20.0" fill="url(#g6)"><tspan x="608" dy="0.0">校企资源协同赋能</tspan></text>
<text class="ct" x="516" y="417" text-anchor="start" font-family="'OPPOSans R','Source Han Sans CN Regular','Microsoft YaHei',sans-serif" font-size="19.0" fill="#BFE0F2"><tspan x="516" dy="0.0">校企资源协同赋能：联动新西伯</tspan><tspan x="516" dy="25.1">利亚国立大学科研平台，举办稀</tspan><tspan x="516" dy="25.1">土绿色回收技术研讨会，以实证</tspan><tspan x="516" dy="25.1">案例吸引产业链企业参与，建立</tspan><tspan x="516" dy="25.1">高意向客户清单，实现技术背书</tspan><tspan x="516" dy="25.1">与资源网络双驱动。</tspan></text>
<text class="ct" x="928" y="301" text-anchor="start" font-family="'Alibaba PuHuiTi H','OPPOSans B','Source Han Sans CN Heavy','Arial',sans-serif" font-size="42.0" fill="url(#g7)"><tspan x="928" dy="0.0">03</tspan></text>
<text class="ct" x="1010" y="296" text-anchor="start" font-family="'Alibaba PuHuiTi H','Source Han Sans CN Heavy','Microsoft YaHei',sans-serif" font-size="20.0" fill="url(#g8)"><tspan x="1010" dy="0.0">梯度渗透市场覆盖</tspan></text>
<text class="ct" x="918" y="405" text-anchor="start" font-family="'OPPOSans R','Source Han Sans CN Regular','Microsoft YaHei',sans-serif" font-size="19.0" fill="#BFE0F2"><tspan x="918" dy="0.0">梯度渗透市场覆盖：立足标杆客</tspan><tspan x="918" dy="25.1">户细分领域，通过定向技术分享</tspan><tspan x="918" dy="25.1">、行业白皮书、线上直播与专业</tspan><tspan x="918" dy="25.1">会议组合策略，推动成功模式向</tspan><tspan x="918" dy="25.1">区域及跨应用场景有序复制，稳</tspan><tspan x="918" dy="25.1">步扩大市场影响力与品牌认知度</tspan><tspan x="918" dy="25.1">。</tspan></text>
