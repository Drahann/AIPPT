<text class="ct" x="640" y="35" text-anchor="middle" font-family="'华文行楷','STXingkai','Source Han Serif CN Heavy','KaiTi',serif" font-size="42.0" fill="url(#g1)"><tspan x="640" dy="0.0">落地前景</tspan></text>
<text class="ct" x="69" y="76" text-anchor="middle" font-family="'Alibaba PuHuiTi H','OPPOSans B','Source Han Sans CN Heavy','Arial',sans-serif" font-size="18.0" fill="#F7C076"><tspan x="69" dy="0.0">01</tspan></text>
<text class="ct" x="124" y="78" text-anchor="start" font-family="'Alibaba PuHuiTi H','Source Han Sans CN Heavy','Microsoft YaHei',sans-serif" font-size="24.0" fill="#FFFFFF"><tspan x="124" dy="0.0">产业化实施路径</tspan></text>
<text class="ct" x="50" y="112" text-anchor="start" font-family="'OPPOSans B','Source Han Sans CN Bold','Microsoft YaHei',sans-serif" font-size="18.0" fill="#15F7F9"><tspan x="50" dy="0.0">第一年·中试验证</tspan></text>
<text class="ct" x="24" y="156" text-anchor="start" font-family="'OPPOSans R','Source Han Sans CN Regular','Microsoft YaHei',sans-serif" font-size="18.0" fill="#E7E6E6"><tspan x="24" dy="0.0">完成TIE331工艺</tspan><tspan x="24" dy="23.8">参数固化与中试放大，</tspan><tspan x="24" dy="23.8">对接2家稀土回收领域</tspan><tspan x="24" dy="23.8">标杆企业开展小批量试</tspan><tspan x="24" dy="23.8">用，验证单级萃取效率</tspan><tspan x="24" dy="23.8">（目标回收率≥85%</tspan><tspan x="24" dy="23.8">）与工艺适配性，形成</tspan><tspan x="24" dy="23.8">可复制的技术实施方案</tspan><tspan x="24" dy="23.8">。</tspan></text>
<text class="ct" x="248" y="112" text-anchor="start" font-family="'OPPOSans B','Source Han Sans CN Bold','Microsoft YaHei',sans-serif" font-size="18.0" fill="#15F7F9"><tspan x="248" dy="0.0">第二年·产品拓展</tspan></text>
<text class="ct" x="222" y="180" text-anchor="start" font-family="'OPPOSans R','Source Han Sans CN Regular','Microsoft YaHei',sans-serif" font-size="18.0" fill="#E7E6E6"><tspan x="222" dy="0.0">推进TIE332-T</tspan><tspan x="222" dy="23.8">IE350系列开发，</tspan><tspan x="222" dy="23.8">拓展至3家标杆客户，</tspan><tspan x="222" dy="23.8">深化校企协同合作，积</tspan><tspan x="222" dy="23.8">累跨场景应用数据，完</tspan><tspan x="222" dy="23.8">善&quot;技术方案+定制服</tspan><tspan x="222" dy="23.8">务&quot;轻资产服务模式。</tspan></text>
<text class="ct" x="447" y="112" text-anchor="start" font-family="'OPPOSans B','Source Han Sans CN Bold','Microsoft YaHei',sans-serif" font-size="18.0" fill="#15F7F9"><tspan x="447" dy="0.0">第三年·模式固化</tspan></text>
<text class="ct" x="421" y="168" text-anchor="start" font-family="'OPPOSans R','Source Han Sans CN Regular','Microsoft YaHei',sans-serif" font-size="18.0" fill="#E7E6E6"><tspan x="421" dy="0.0">完成TIE331-T</tspan><tspan x="421" dy="23.8">IE381全系产品矩</tspan><tspan x="421" dy="23.8">阵优化，依托客户反馈</tspan><tspan x="421" dy="23.8">闭环迭代技术，实现累</tspan><tspan x="421" dy="23.8">计销售收入20万元目</tspan><tspan x="421" dy="23.8">标，验证商业模式可行</tspan><tspan x="421" dy="23.8">性，为规模化复制奠定</tspan><tspan x="421" dy="23.8">基础。</tspan></text>
<text class="ct" x="714" y="76" text-anchor="middle" font-family="'Alibaba PuHuiTi H','OPPOSans B','Source Han Sans CN Heavy','Arial',sans-serif" font-size="18.0" fill="#F7C076"><tspan x="714" dy="0.0">02</tspan></text>
<text class="ct" x="769" y="78" text-anchor="start" font-family="'Alibaba PuHuiTi H','Source Han Sans CN Heavy','Microsoft YaHei',sans-serif" font-size="24.0" fill="#FFFFFF"><tspan x="769" dy="0.0">市场推广策略</tspan></text>
<text class="ct" x="695" y="112" text-anchor="start" font-family="'OPPOSans B','Source Han Sans CN Bold','Microsoft YaHei',sans-serif" font-size="18.0" fill="#15F7F9"><tspan x="695" dy="0.0">精准锚定标杆</tspan></text>
<text class="ct" x="669" y="168" text-anchor="start" font-family="'OPPOSans R','Source Han Sans CN Regular','Microsoft YaHei',sans-serif" font-size="18.0" fill="#E7E6E6"><tspan x="669" dy="0.0">聚焦稀土回收企业及萃</tspan><tspan x="669" dy="23.8">取剂生产商，针对单级</tspan><tspan x="669" dy="23.8">萃取效率低、溶剂损耗</tspan><tspan x="669" dy="23.8">高等痛点，以小批量试</tspan><tspan x="669" dy="23.8">用快速验证TIE33</tspan><tspan x="669" dy="23.8">1产品在回收率提升与</tspan><tspan x="669" dy="23.8">成本控制方面的实效，</tspan><tspan x="669" dy="23.8">形成可量化合作案例。</tspan></text>
<text class="ct" x="893" y="112" text-anchor="start" font-family="'OPPOSans B','Source Han Sans CN Bold','Microsoft YaHei',sans-serif" font-size="18.0" fill="#15F7F9"><tspan x="893" dy="0.0">校企资源协同</tspan></text>
<text class="ct" x="867" y="180" text-anchor="start" font-family="'OPPOSans R','Source Han Sans CN Regular','Microsoft YaHei',sans-serif" font-size="18.0" fill="#E7E6E6"><tspan x="867" dy="0.0">联动新西伯利亚国立大</tspan><tspan x="867" dy="23.8">学科研平台，举办稀土</tspan><tspan x="867" dy="23.8">绿色回收技术研讨会，</tspan><tspan x="867" dy="23.8">以实证案例吸引产业链</tspan><tspan x="867" dy="23.8">企业参与，建立高意向</tspan><tspan x="867" dy="23.8">客户清单，实现技术背</tspan><tspan x="867" dy="23.8">书与资源网络双驱动。</tspan></text>
<text class="ct" x="1092" y="112" text-anchor="start" font-family="'OPPOSans B','Source Han Sans CN Bold','Microsoft YaHei',sans-serif" font-size="18.0" fill="#15F7F9"><tspan x="1092" dy="0.0">梯度渗透覆盖</tspan></text>
<text class="ct" x="1066" y="168" text-anchor="start" font-family="'OPPOSans R','Source Han Sans CN Regular','Microsoft YaHei',sans-serif" font-size="18.0" fill="#E7E6E6"><tspan x="1066" dy="0.0">立足标杆客户细分领域</tspan><tspan x="1066" dy="23.8">，通过定向技术分享、</tspan><tspan x="1066" dy="23.8">行业白皮书、线上直播</tspan><tspan x="1066" dy="23.8">与专业会议组合策略，</tspan><tspan x="1066" dy="23.8">推动成功模式向区域及</tspan><tspan x="1066" dy="23.8">跨应用场景有序复制，</tspan><tspan x="1066" dy="23.8">稳步扩大市场影响力与</tspan><tspan x="1066" dy="23.8">品牌认知度。</tspan></text>
<text class="ct" x="69" y="416" text-anchor="middle" font-family="'Alibaba PuHuiTi H','OPPOSans B','Source Han Sans CN Heavy','Arial',sans-serif" font-size="18.0" fill="#F7C076"><tspan x="69" dy="0.0">03</tspan></text>
<text class="ct" x="124" y="418" text-anchor="start" font-family="'Alibaba PuHuiTi H','Source Han Sans CN Heavy','Microsoft YaHei',sans-serif" font-size="24.0" fill="#FFFFFF"><tspan x="124" dy="0.0">综合效益展望</tspan></text>
<text class="ct" x="50" y="452" text-anchor="start" font-family="'OPPOSans B','Source Han Sans CN Bold','Microsoft YaHei',sans-serif" font-size="18.0" fill="#15F7F9"><tspan x="50" dy="0.0">经济效益</tspan></text>
<text class="ct" x="24" y="532" text-anchor="start" font-family="'OPPOSans R','Source Han Sans CN Regular','Microsoft YaHei',sans-serif" font-size="18.0" fill="#E7E6E6"><tspan x="24" dy="0.0">轻资产运营模式显著降低初期投入，</tspan><tspan x="24" dy="23.8">依托溶剂可循环特性压缩长期成本；</tspan><tspan x="24" dy="23.8">三年内验证商业模式可行性，后续通</tspan><tspan x="24" dy="23.8">过技术授权、定制服务等高附加值路</tspan><tspan x="24" dy="23.8">径提升盈利空间，形成良性现金流循</tspan><tspan x="24" dy="23.8">环。</tspan></text>
<text class="ct" x="348" y="452" text-anchor="start" font-family="'OPPOSans B','Source Han Sans CN Bold','Microsoft YaHei',sans-serif" font-size="18.0" fill="#15F7F9"><tspan x="348" dy="0.0">社会效益</tspan></text>
<text class="ct" x="322" y="544" text-anchor="start" font-family="'OPPOSans R','Source Han Sans CN Regular','Microsoft YaHei',sans-serif" font-size="18.0" fill="#E7E6E6"><tspan x="322" dy="0.0">推动工业废弃物中稀土资源高效绿色</tspan><tspan x="322" dy="23.8">回收，减少环境污染，惠及稀土产业</tspan><tspan x="322" dy="23.8">及受污染地区人群；为行业提供可推</tspan><tspan x="322" dy="23.8">广的资源化技术方案，助力工艺升级</tspan><tspan x="322" dy="23.8">与国家循环经济战略实施。</tspan></text>
<text class="ct" x="714" y="416" text-anchor="middle" font-family="'Alibaba PuHuiTi H','OPPOSans B','Source Han Sans CN Heavy','Arial',sans-serif" font-size="18.0" fill="#F7C076"><tspan x="714" dy="0.0">04</tspan></text>
<text class="ct" x="769" y="418" text-anchor="start" font-family="'Alibaba PuHuiTi H','Source Han Sans CN Heavy','Microsoft YaHei',sans-serif" font-size="24.0" fill="#FFFFFF"><tspan x="769" dy="0.0">风险应对机制</tspan></text>
<text class="ct" x="695" y="452" text-anchor="start" font-family="'OPPOSans B','Source Han Sans CN Bold','Microsoft YaHei',sans-serif" font-size="18.0" fill="#15F7F9"><tspan x="695" dy="0.0">市场风险</tspan></text>
<text class="ct" x="669" y="544" text-anchor="start" font-family="'OPPOSans R','Source Han Sans CN Regular','Microsoft YaHei',sans-serif" font-size="18.0" fill="#E7E6E6"><tspan x="669" dy="0.0">采用&quot;精准锚定+梯度</tspan><tspan x="669" dy="23.8">扩张&quot;策略，优先验证</tspan><tspan x="669" dy="23.8">高匹配度客户，预留运</tspan><tspan x="669" dy="23.8">营资金应对需求波动，</tspan><tspan x="669" dy="23.8">动态优化推广节奏。</tspan></text>
<text class="ct" x="893" y="452" text-anchor="start" font-family="'OPPOSans B','Source Han Sans CN Bold','Microsoft YaHei',sans-serif" font-size="18.0" fill="#15F7F9"><tspan x="893" dy="0.0">技术风险</tspan></text>
<text class="ct" x="867" y="532" text-anchor="start" font-family="'OPPOSans R','Source Han Sans CN Regular','Microsoft YaHei',sans-serif" font-size="18.0" fill="#E7E6E6"><tspan x="867" dy="0.0">依托高校科研平台与中</tspan><tspan x="867" dy="23.8">试验证闭环持续优化工</tspan><tspan x="867" dy="23.8">艺参数，建立客户反馈</tspan><tspan x="867" dy="23.8">实时迭代机制，确保技</tspan><tspan x="867" dy="23.8">术与产业需求同步演进</tspan><tspan x="867" dy="23.8">。</tspan></text>
<text class="ct" x="1092" y="452" text-anchor="start" font-family="'OPPOSans B','Source Han Sans CN Bold','Microsoft YaHei',sans-serif" font-size="18.0" fill="#15F7F9"><tspan x="1092" dy="0.0">运营风险</tspan></text>
<text class="ct" x="1066" y="508" text-anchor="start" font-family="'OPPOSans R','Source Han Sans CN Regular','Microsoft YaHei',sans-serif" font-size="18.0" fill="#E7E6E6"><tspan x="1066" dy="0.0">核心团队持股激励（融</tspan><tspan x="1066" dy="23.8">资后合计34.3%）</tspan><tspan x="1066" dy="23.8">强化长期绑定；专项资</tspan><tspan x="1066" dy="23.8">金账户与分阶段拨付制</tspan><tspan x="1066" dy="23.8">度保障资金高效使用；</tspan><tspan x="1066" dy="23.8">轻资产结构降低固定成</tspan><tspan x="1066" dy="23.8">本负担，全面提升抗风</tspan><tspan x="1066" dy="23.8">险韧性。</tspan></text>
</svg>