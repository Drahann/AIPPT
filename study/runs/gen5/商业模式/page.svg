<text x="108" y="88" text-anchor="start" font-family="'华文行楷','STXingkai','Source Han Serif CN Heavy','KaiTi',serif" font-size="50.0" fill="url(#g1)"><tspan x="108" dy="0.0">商业模式</tspan></text>
<text x="112" y="126" text-anchor="start" font-family="'OPPOSans M','Source Han Sans CN Medium','Microsoft YaHei',sans-serif" font-size="16.0" fill="#C3D6F2"><tspan x="112" dy="0.0">全链路整合驱动医用涂层国产化替代 · 上游原料—中游加工—下游应用闭环生态</tspan></text>
<text x="74" y="161" text-anchor="start" font-family="'OPPOSans M','Source Han Sans CN Medium','Microsoft YaHei',sans-serif" font-size="15.0" fill="#FFFFFF"><tspan x="74" dy="0.0">核心枢纽：宁波谷泽新生生物科技有限公司 · 整合上下游资源并主导运营</tspan></text>
<text x="1031" y="162" text-anchor="middle" font-family="'OPPOSans M','Source Han Sans CN Medium','Microsoft YaHei',sans-serif" font-size="14.0" fill="#F2D290"><tspan x="1031" dy="0.0">宁波大学科研平台 / 院士团队 · 技术策源</tspan></text>
<text x="118" y="230" text-anchor="middle" font-family="'OPPOSans M','Source Han Sans CN Medium','Microsoft YaHei',sans-serif" font-size="13.5" fill="#F2D290"><tspan x="118" dy="0.0">上游</tspan></text>
<text x="174" y="230" text-anchor="start" font-family="'Alibaba PuHuiTi H','Source Han Sans CN Heavy','Microsoft YaHei',sans-serif" font-size="21.0" fill="url(#g2)"><tspan x="174" dy="0.0">原料供给</tspan></text>
<text x="74" y="263" text-anchor="start" font-family="'OPPOSans M','Source Han Sans CN Medium','Microsoft YaHei',sans-serif" font-size="9.0" fill="#FFFFFF"><tspan x="74" dy="0.0">中粮集团 · 安徽顺鑫 · 金润米业 · 水龙米业</tspan></text>
<text x="74" y="297" text-anchor="start" font-family="'OPPOSans R','Source Han Sans CN Regular','Microsoft YaHei',sans-serif" font-size="14.0" fill="#C3D6F2"><tspan x="74" dy="0.0">联动优质粮企保障大米蛋白原料稳定供给，夯实国</tspan><tspan x="74" dy="18.5">产化成本基础。</tspan></text>
<text x="528" y="230" text-anchor="middle" font-family="'OPPOSans M','Source Han Sans CN Medium','Microsoft YaHei',sans-serif" font-size="13.5" fill="#F2D290"><tspan x="528" dy="0.0">中游</tspan></text>
<text x="584" y="230" text-anchor="start" font-family="'Alibaba PuHuiTi H','Source Han Sans CN Heavy','Microsoft YaHei',sans-serif" font-size="21.0" fill="url(#g3)"><tspan x="584" dy="0.0">合规加工</tspan></text>
<text x="484" y="265" text-anchor="start" font-family="'OPPOSans M','Source Han Sans CN Medium','Microsoft YaHei',sans-serif" font-size="15.0" fill="#FFFFFF"><tspan x="484" dy="0.0">江西盖比欧科技</tspan></text>
<text x="484" y="297" text-anchor="start" font-family="'OPPOSans R','Source Han Sans CN Regular','Microsoft YaHei',sans-serif" font-size="14.0" fill="#C3D6F2"><tspan x="484" dy="0.0">委托规范化加工，严控医疗器械级生产标准与批次</tspan><tspan x="484" dy="18.5">一致性（RSD＜3%）。</tspan></text>
<text x="938" y="230" text-anchor="middle" font-family="'OPPOSans M','Source Han Sans CN Medium','Microsoft YaHei',sans-serif" font-size="13.5" fill="#F2D290"><tspan x="938" dy="0.0">下游</tspan></text>
<text x="994" y="230" text-anchor="start" font-family="'Alibaba PuHuiTi H','Source Han Sans CN Heavy','Microsoft YaHei',sans-serif" font-size="21.0" fill="url(#g4)"><tspan x="994" dy="0.0">临床应用</tspan></text>
<text x="894" y="265" text-anchor="start" font-family="'OPPOSans M','Source Han Sans CN Medium','Microsoft YaHei',sans-serif" font-size="15.0" fill="#FFFFFF"><tspan x="894" dy="0.0">海生医疗 · 先健科技</tspan></text>
<text x="894" y="297" text-anchor="start" font-family="'OPPOSans R','Source Han Sans CN Regular','Microsoft YaHei',sans-serif" font-size="14.0" fill="#C3D6F2"><tspan x="894" dy="0.0">服务造影导管制造企业，直击进口肝素成本高、批</tspan><tspan x="894" dy="18.5">次波动、润滑不足痛点。</tspan></text>
<text x="254" y="387" text-anchor="middle" font-family="'OPPOSans M','Source Han Sans CN Medium','Microsoft YaHei',sans-serif" font-size="8.7" fill="#F2D290"><tspan x="254" dy="0.0">谷原焕生 · 单支涂层成本6元（较进口降低60%）</tspan></text>
<text x="470" y="387" text-anchor="start" font-family="'OPPOSans R','Source Han Sans CN Regular','Microsoft YaHei',sans-serif" font-size="8.4" fill="#C3D6F2"><tspan x="470" dy="0.0">价值流高效触达客户 → 资金流反哺研发迭代与产能 → 客户数据实时优化体系，技术流·资金流·数据流双向循环。</tspan></text>
<text x="90" y="462" text-anchor="middle" font-family="'Alibaba PuHuiTi H','OPPOSans B','Source Han Sans CN Heavy','Arial',sans-serif" font-size="20.0" fill="url(#g5)"><tspan x="90" dy="0.0">①</tspan></text>
<text x="122" y="463" text-anchor="start" font-family="'Alibaba PuHuiTi H','Source Han Sans CN Heavy','Microsoft YaHei',sans-serif" font-size="20.0" fill="#FFFFFF"><tspan x="122" dy="0.0">价值传递</tspan></text>
<text x="74" y="516" text-anchor="start" font-family="'OPPOSans R','Source Han Sans CN Regular','Microsoft YaHei',sans-serif" font-size="14.0" fill="#C3D6F2"><tspan x="74" dy="0.0">以项目公司为枢纽构建“上游原料—中游加工—下游应</tspan><tspan x="74" dy="18.5">用”闭环生态，客户试用数据实时输入，形成“市场反</tspan><tspan x="74" dy="18.5">馈—技术升级—价值强化”动态循环。</tspan></text>
<text x="487" y="462" text-anchor="middle" font-family="'Alibaba PuHuiTi H','OPPOSans B','Source Han Sans CN Heavy','Arial',sans-serif" font-size="20.0" fill="url(#g6)"><tspan x="487" dy="0.0">②</tspan></text>
<text x="519" y="463" text-anchor="start" font-family="'Alibaba PuHuiTi H','Source Han Sans CN Heavy','Microsoft YaHei',sans-serif" font-size="20.0" fill="#FFFFFF"><tspan x="519" dy="0.0">校企赋能</tspan></text>
<text x="471" y="516" text-anchor="start" font-family="'OPPOSans R','Source Han Sans CN Regular','Microsoft YaHei',sans-serif" font-size="14.0" fill="#C3D6F2"><tspan x="471" dy="0.0">深度依托宁波大学与院士团队，建立“技术共研—验证</tspan><tspan x="471" dy="18.5">共担—人才共育”机制；借高校公信力快速建立市场信</tspan><tspan x="471" dy="18.5">任，共享实验与检测资源显著降本。</tspan></text>
<text x="884" y="462" text-anchor="middle" font-family="'Alibaba PuHuiTi H','OPPOSans B','Source Han Sans CN Heavy','Arial',sans-serif" font-size="20.0" fill="url(#g7)"><tspan x="884" dy="0.0">③</tspan></text>
<text x="916" y="463" text-anchor="start" font-family="'Alibaba PuHuiTi H','Source Han Sans CN Heavy','Microsoft YaHei',sans-serif" font-size="20.0" fill="#FFFFFF"><tspan x="916" dy="0.0">生态共赢</tspan></text>
<text x="868" y="526" text-anchor="start" font-family="'OPPOSans R','Source Han Sans CN Regular','Microsoft YaHei',sans-serif" font-size="14.0" fill="#C3D6F2"><tspan x="868" dy="0.0">权责清晰、利益共享，形成抗风险强、迭代快的产业共</tspan><tspan x="868" dy="18.5">同体，构筑可持续护城河：</tspan></text>
<text x="924" y="645" text-anchor="middle" font-family="'OPPOSans M','Source Han Sans CN Medium','Microsoft YaHei',sans-serif" font-size="12.5" fill="#7FE9CF"><tspan x="924" dy="0.0">成本·降本60%</tspan></text>
<text x="1032" y="645" text-anchor="middle" font-family="'OPPOSans M','Source Han Sans CN Medium','Microsoft YaHei',sans-serif" font-size="12.5" fill="#7FE9CF"><tspan x="1032" dy="0.0">技术·超进口</tspan></text>
<text x="1134" y="645" text-anchor="middle" font-family="'OPPOSans M','Source Han Sans CN Medium','Microsoft YaHei',sans-serif" font-size="12.5" fill="#7FE9CF"><tspan x="1134" dy="0.0">生态·校企协同</tspan></text>
</svg>